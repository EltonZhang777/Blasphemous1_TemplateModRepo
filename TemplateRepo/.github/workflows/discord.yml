name: Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - name: Warn when webhook is missing
        if: env.WEBHOOK_URL == ''
        run: echo "::warning::WEBHOOK_URL is not configured; skipping Discord notification."

      - name: Post release to Discord
        if: env.WEBHOOK_URL != ''
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          payload=$(jq -n --arg content "Release published: $RELEASE_NAME - $RELEASE_URL" '{content: $content}')
          curl --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$WEBHOOK_URL"
