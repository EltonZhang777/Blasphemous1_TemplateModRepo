name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve solution and project
        run: |
          $solutions = @(Get-ChildItem -LiteralPath . -Filter *.sln -File)
          $projects = @(Get-ChildItem -LiteralPath . -Filter *.csproj -File)
          if ($solutions.Count -ne 1 -or $projects.Count -ne 1) {
            throw 'Expected exactly one solution and one root project.'
          }
          "SOLUTION=$($solutions[0].Name)" >> $env:GITHUB_ENV
          "PROJECT=$($projects[0].Name)" >> $env:GITHUB_ENV

      - name: Enforce CRLF for tracked C# files
        run: ./scripts/check-crlf.ps1

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION --configuration Release --no-build

      - name: Check formatting
        run: |
          dotnet format whitespace $env:SOLUTION --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format style $env:SOLUTION --no-restore --severity warn --verify-no-changes
